{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >
    <title>Portafolio INTRA</title>
    <link
        rel="stylesheet"
        href="{% static 'portafolio/css/portafolio.css' %}"
    >
</head>
<body>
    <div class="shell">
        <aside>
            <h2>Portafolio</h2>
            <p>Grupo Intra</p>

            <a href="{% url 'portafolio:dashboard' %}">
                Dashboard
            </a>
            <a href="{% url 'portafolio:instrumentos' %}">
                Instrumentos
            </a>
            <a href="{% url 'portafolio:documentos' %}">
                Documentos
            </a>
            <a href="{% url 'portafolio:plantillas' %}">
                Plantillas PDF
            </a>
            <a href="{% url 'portafolio:reportes' %}">
                Reportes
            </a>
            <a href="{% url 'portafolio:recursos' %}">
                Recursos
            </a>
            <a href="{% url 'dashboard' %}">
                ← Panel principal
            </a>
        </aside>

        <main>
            <header>
                <small>PORTAFOLIO INTRA</small>
                <h1>{% block titulo %}{% endblock %}</h1>
            </header>

            {% block contenido %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
